protocol_version: v0.2
project_root: /data/yunzliu/perturbation_status_estimation_benchmark
output_root: 07_benchmark/outputs
work_root: 07_benchmark/work
log_root: 07_benchmark/logs

cohort:
  eligible_assignment_structures: [single_guide, concordant_construct]
  min_cells_per_perturbation: 20
  min_cells_per_reagent: 10

statistics:
  bootstrap_resamples: 1000
  seed: 20260913

resources:
  max_workers: 16
  numeric_threads_per_worker: 1
  memory_soft_limit_gib: 96
  memory_hard_limit_gib: 120

datasets:
  papalexi2021:
    modality: CRISPRko
    h5ad: 01_standardize_inputs/outputs/papalexi2021/perturbation_adata.h5ad
    metadata:
      cell_id: cell_id
      target: target_label
      control: is_ntc
      assignment: assignment_structure
      batch: batch_id
      reagent: guide_id
    perturbation_delimiter: null
    methods:
      mixscape:
        path: 03_mixscape/sharding/outputs/papalexi2021_pooled/merged/mixscape_metadata.tsv.gz
        target_column: target_label
        score_column: mixscape_class_p_ko
        status_column: mixscape_class.global
        active_status: KO
        inactive_status: NP
      mixscale:
        path: 04_mixscale/sharding/outputs/papalexi2021_pooled/merged/mixscale_metadata.tsv.gz
        target_column: target_label
        score_column: mixscale_score
        availability:
          mode: rds_shards
          glob: 04_mixscale/sharding/outputs/papalexi2021_pooled/shards/shard_*/mixscale_tool.rds
      ps:
        path: 05_ps/outputs/papalexi2021/scalable/ps_metadata.tsv
        target_column: target_label
        score_column: ps_score
        status_column: ps_status
        scorable_status: modeled

  norman2019:
    modality: CRISPRa
    h5ad: 01_standardize_inputs/outputs/norman2019/perturbation_adata.h5ad
    metadata:
      cell_id: cell_id
      target: target_label
      control: is_ntc
      assignment: assignment_structure
      batch: batch_id
      reagent: guide_id
    perturbation_delimiter: "+"
    methods:
      mixscape:
        path: 03_mixscape/sharding/outputs/norman2019_pooled/merged/mixscape_metadata.tsv.gz
        target_column: target_label
        score_column: mixscape_class_p_crispra
        status_column: mixscape_class.global
        active_status: CRISPRa
        inactive_status: NP
      mixscale:
        path: 04_mixscale/sharding/outputs/norman2019_pooled/merged/mixscale_metadata.tsv.gz
        target_column: target_label
        score_column: mixscale_score
        availability:
          mode: rds_shards
          glob: 04_mixscale/sharding/outputs/norman2019_pooled/shards/shard_*/mixscale_tool.rds
      ps:
        path: 05_ps/outputs/norman2019/scalable/ps_metadata.tsv
        target_column: target_label
        score_column: ps_score
        status_column: ps_status
        scorable_status: modeled

  replogle2022:
    modality: CRISPRi
    h5ad: 01_standardize_inputs/outputs/replogle2022/perturbation_adata.h5ad
    metadata:
      cell_id: cell_id
      target: target_label
      control: is_ntc
      assignment: assignment_structure
      batch: batch_id
      reagent: guide_id
    perturbation_delimiter: null
    methods:
      mixscape:
        path: 03_mixscape/sharding/outputs/replogle2022_pooled/merged/mixscape_metadata.tsv.gz
        target_column: target_label
        score_column: mixscape_class_p_crispri
        status_column: mixscape_class.global
        active_status: CRISPRi
        inactive_status: NP
      mixscale:
        path: 04_mixscale/sharding/outputs/replogle2022_pooled/merged/mixscale_metadata.tsv.gz
        target_column: target_label
        score_column: mixscale_score
        availability:
          mode: rds_shards
          glob: 04_mixscale/sharding/outputs/replogle2022_pooled/shards/shard_*/mixscale_tool.rds
      ps:
        path: 05_ps/outputs/replogle2022/scalable/ps_metadata.tsv
        target_column: target_label
        score_column: ps_score
        status_column: ps_status
        scorable_status: modeled
